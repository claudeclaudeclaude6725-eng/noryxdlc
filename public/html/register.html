<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Регистрация — NoryxDLC</title> <link rel="stylesheet" href="../css/style.css"> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"> </head> <body> <div id="bgFull"></div> <div id="bgOverlay"></div> <div class="orb orb-1"></div> <div class="orb orb-2"></div> <div class="auth-page"> <div class="auth-card auth-card--register"> <div class="auth-logo"> <img src="/assets/logo.png" alt="Logo" class="auth-logo-img" onerror='this.style.display="none"'> <span class="auth-logo-text">NoryxDLC</span> </div> <h1 class="auth-heading">Создать аккаунт</h1> <p class="auth-sub">Присоединяйтесь к NoryxDLC — это бесплатно</p> <div class="field-group"> <div class="field-wrap"> <label class="field-label" for="reg-username">Имя пользователя</label> <input class="input-field" id="reg-username" placeholder="coolplayer123" autocomplete="username"> <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/> <circle cx="12" cy="7" r="4"/> </svg> </div> <div class="field-wrap"> <label class="field-label" for="reg-email">Email</label> <input type="email" class="input-field" id="reg-email" placeholder="example@mail.com" autocomplete="email"> <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/> <polyline points="22,6 12,13 2,6"/> </svg> </div> <div class="field-wrap"> <label class="field-label" for="reg-password">Пароль</label> <input type="password" class="input-field" id="reg-password" placeholder="••••••••" autocomplete="new-password" oninput="checkStrength(this.value)"> <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/> <path d="M7 11V7a5 5 0 0 1 10 0v4"/> </svg> <button class="password-toggle" type="button" id="toggle-reg-password" aria-label="Показать пароль"> <svg id="reg-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17"> <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/> <circle cx="12" cy="12" r="3"/> </svg> </button> <div class="strength-bar" id="strength-bar"> <div class="strength-bar-seg" id="seg1"></div> <div class="strength-bar-seg" id="seg2"></div> <div class="strength-bar-seg" id="seg3"></div> <div class="strength-bar-seg" id="seg4"></div> </div> <div class="strength-label" id="strength-label"></div> </div> </div> <div class="auth-error" id="reg-error"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"> <circle cx="12" cy="12" r="10"/> <line x1="12" y1="8" x2="12" y2="12"/> <line x1="12" y1="16" x2="12.01" y2="16"/> </svg> <span id="reg-error-text"></span> </div> <p class="policy-hint"> Создавая аккаунт, вы соглашаетесь с <a href="/html/policy.html">Политикой сервиса</a>. </p> <button class="btn-auth" id="reg-btn" onclick="doRegisterNew()"> <span class="btn-text">Зарегистрироваться</span> <span class="btn-spinner"></span> </button> <div class="auth-divider"><span>уже есть аккаунт?</span></div> <div class="auth-footer"> <a href="/html/login.html">Войти в существующий аккаунт</a> </div> </div> </div> <script src="/js/auth.js"></script> <script>function checkStrength(e){var t=[document.getElementById("seg1"),document.getElementById("seg2"),document.getElementById("seg3"),document.getElementById("seg4")],r=document.getElementById("strength-label");if(t.forEach(function(e){e.className="strength-bar-seg"}),e){var n=0;e.length>=8&&n++,/[A-Z]/.test(e)&&n++,/[0-9]/.test(e)&&n++,/[^A-Za-z0-9]/.test(e)&&n++;for(var o=n<=1?"weak":n<=3?"medium":"strong",s=0;s<n;s++)t[s].classList.add(o);r.textContent=["","Слабый","Средний","Хороший","Надёжный"][n]||"",r.style.color="weak"===o?"#EF4444":"medium"===o?"#F59E0B":"#4ADE80"}else r.textContent=""}function showAuthError(e){var t=document.getElementById("reg-error");document.getElementById("reg-error-text").textContent=e,t.classList.add("visible")}function hideAuthError(){document.getElementById("reg-error").classList.remove("visible")}function isValidEmail(e){return/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)}async function doRegisterNew(){hideAuthError();var e=document.getElementById("reg-username").value.trim(),t=document.getElementById("reg-email").value.trim(),r=document.getElementById("reg-password").value;if(e&&t&&r)if(e.length<3)showAuthError("Имя пользователя — минимум 3 символа");else if(isValidEmail(t))if(r.length<6)showAuthError("Пароль — минимум 6 символов");else{var n=document.getElementById("reg-btn");n.classList.add("loading");try{var o=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({username:e,email:t,password:r})}),s=await o.json();if(!o.ok)return void showAuthError(s.error||"Ошибка регистрации");if(s.user)try{localStorage.setItem("noryx_user",JSON.stringify(s.user))}catch(e){}window.location.href="/html/profile.html"}catch(e){showAuthError("Ошибка сети. Попробуйте снова")}finally{n.classList.remove("loading")}}else showAuthError("Введите корректный email");else showAuthError("Заполните все поля")}document.getElementById("toggle-reg-password").addEventListener("click",function(){var e=document.getElementById("reg-password"),t="password"===e.type;e.type=t?"text":"password",document.getElementById("reg-eye-icon").innerHTML=t?'<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>':'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'}),document.addEventListener("keydown",function(e){"Enter"===e.key&&doRegisterNew()})</script> </body> </html>
