<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — NoryxDLC</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="bgFull"></div>
<div id="bgOverlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="dashboard">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <span style="color:var(--primary);font-size:22px">✦</span>
      <span class="sidebar-logo-text">Admin</span>
    </div>
    <button class="sidebar-item active" onclick="adminTab('users',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Пользователи
    </button>
    <button class="sidebar-item" onclick="adminTab('promos',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      Промокоды
    </button>
    <button class="sidebar-item" onclick="adminTab('give-media',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      Выдать MEDIA
    </button>
    <button class="sidebar-item" onclick="adminTab('media',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Управление MEDIA
    </button>
    <button class="sidebar-item" onclick="adminTab('ban',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      Заблокировать
    </button>
    <button class="sidebar-item" onclick="adminTab('withdrawals',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Выводы MEDIA
    </button>
    <div class="sidebar-spacer"></div>
    <a href="/html/profile.html" class="sidebar-item" style="color:rgba(255,255,255,0.35)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Назад в профиль
    </a>
  </aside>

  <main class="dash-main">
    <h1 class="dash-title" id="admin-title">Пользователи</h1>

    <div id="atab-users" class="admin-tab">
      <div class="glass-card" style="padding:0;overflow:hidden">
        <div id="users-table" style="overflow-x:auto">
          <div style="padding:32px;text-align:center;color:rgba(255,255,255,0.3)">Загрузка...</div>
        </div>
      </div>
      <div id="users-pagination" class="pagination-wrap"></div>
    </div>

    <div id="atab-promos" class="admin-tab" style="display:none">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
        <div class="glass-card" style="flex:1;min-width:280px">
          <h3 class="admin-card-title">Созданные промокоды</h3>
          <div id="promos-list"><p style="color:rgba(255,255,255,0.3);font-size:14px">Загрузка...</p></div>
        </div>
        <div class="glass-card" style="flex:1;min-width:280px">
          <h3 class="admin-card-title">Создать промокод</h3>
          <div style="display:flex;flex-direction:column;gap:14px">
            <input class="input-field" id="promo-code" placeholder="Название промокода"/>
            <div style="display:flex;gap:12px;align-items:center">
              <label style="font-size:13px;color:rgba(255,255,255,0.4);white-space:nowrap">Для юзера:</label>
              <input class="input-field" id="promo-owner" placeholder="Логин (или пусто = общий)"/>
            </div>
            <input class="input-field" id="promo-discount" type="number" min="1" max="100" placeholder="Скидка % (1–100)"/>
            <p id="promo-err" style="font-size:13px;display:none"></p>
            <button class="btn-primary" onclick="createPromo()">Создать</button>
          </div>
        </div>
      </div>
    </div>

    <div id="atab-give-media" class="admin-tab" style="display:none">
      <div class="glass-card" style="max-width:480px">
        <h3 class="admin-card-title">Выдать MEDIA</h3>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div>
            <label class="admin-label">Логин пользователя</label>
            <input class="input-field" id="give-media-login" placeholder="Введите логин"/>
          </div>
          <div>
            <label class="admin-label">Название канала</label>
            <input class="input-field" id="give-media-channel" placeholder="Название канала / YouTube / TikTok"/>
          </div>
          <p id="give-media-err" style="font-size:13px;display:none"></p>
          <button class="btn-primary" onclick="giveMedia()">Выдать MEDIA</button>
        </div>
      </div>
    </div>

    <div id="atab-media" class="admin-tab" style="display:none">
      <div class="glass-card" style="padding:0;overflow:hidden;margin-bottom:16px">
        <div id="media-list" style="padding:20px"></div>
      </div>
      <div id="media-pagination" class="pagination-wrap"></div>
    </div>

    <div id="atab-ban" class="admin-tab" style="display:none">
      <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
        <div class="glass-card" style="flex:1;min-width:280px">
          <h3 class="admin-card-title">Заблокировать пользователя</h3>
          <div style="display:flex;flex-direction:column;gap:14px">
            <div>
              <label class="admin-label">Логин</label>
              <input class="input-field" id="ban-login" placeholder="Логин пользователя"/>
            </div>
            <div>
              <label class="admin-label">Срок блокировки</label>
              <select class="input-field" id="ban-duration">
                <option value="1D">1 день</option>
                <option value="7D">7 дней</option>
                <option value="14D">14 дней</option>
                <option value="30D">30 дней</option>
                <option value="90D">90 дней</option>
                <option value="180D">180 дней</option>
                <option value="360D">360 дней</option>
                <option value="LIFETIME">Навсегда</option>
              </select>
            </div>
            <div>
              <label class="admin-label">Причина</label>
              <input class="input-field" id="ban-reason" placeholder="Укажите причину блокировки"/>
            </div>
            <p id="ban-err" style="font-size:13px;display:none"></p>
            <button class="btn-danger" style="border-radius:9999px;padding:12px 28px;font-size:15px" onclick="banUser()">Заблокировать</button>
          </div>
        </div>
        <div class="glass-card" style="flex:1;min-width:280px">
          <h3 class="admin-card-title">Заблокированные</h3>
          <div id="banned-list"><p style="color:rgba(255,255,255,0.3);font-size:14px">Загрузка...</p></div>
        </div>
      </div>
    </div>

    <div id="atab-withdrawals" class="admin-tab" style="display:none">
      <div class="glass-card">
        <h3 class="admin-card-title">Заявки на вывод</h3>
        <div id="withdrawals-list"><p style="color:rgba(255,255,255,0.3);font-size:14px">Загрузка...</p></div>
      </div>
    </div>

  </main>
</div>

<div class="modal-overlay hidden" id="media-card-modal">
  <div class="modal" style="max-width:440px">
    <button class="modal-close" onclick="closeMediaCard()">✕</button>
    <h2 style="font-size:22px;margin-bottom:8px" id="mc-username"></h2>
    <p style="color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:24px">Баланс: <span id="mc-balance" style="color:var(--success);font-weight:700"></span></p>
    <input type="hidden" id="mc-uid"/>
    <div style="display:flex;flex-direction:column;gap:14px">
      <button class="btn-danger" style="border-radius:9999px;padding:12px" onclick="removeMedia()">Снять MEDIA</button>
      <div>
        <label class="admin-label">Выдать баланс (₽)</label>
        <div style="display:flex;gap:10px;margin-top:6px">
          <input class="input-field" id="mc-give-amount" type="number" min="1" placeholder="Сумма"/>
          <button class="btn-primary" style="white-space:nowrap" onclick="giveBalance()">Выдать</button>
        </div>
      </div>
      <p id="mc-err" style="font-size:13px;display:none"></p>
    </div>
  </div>
</div>

<script src="/js/admin.js"></script>
<script>
document.getElementById('media-card-modal').addEventListener('click', function(e) {
  if (e.target === this) closeMediaCard();
});
</script>
</body>
</html>
