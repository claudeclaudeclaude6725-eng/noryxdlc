<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — NoryxDLC</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<div id="bgFull"></div>
<div id="bgOverlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-page">
  <div class="auth-card auth-card--register">

    <div class="auth-logo">
      <img src="../public/assets/logo.png" alt="Logo" class="auth-logo-img" onerror="this.style.display='none'">
      <span class="auth-logo-text">NoryxDLC</span>
    </div>

    <h1 class="auth-heading">Создать аккаунт</h1>
    <p class="auth-sub">Присоединяйтесь к NoryxDLC — это бесплатно</p>

    <div class="field-group">
      <div class="field-wrap">
        <label class="field-label" for="reg-username">Имя пользователя</label>
        <input
          type="text"
          class="input-field"
          id="reg-username"
          placeholder="coolplayer123"
          autocomplete="username"
        />
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>

      <div class="field-wrap">
        <label class="field-label" for="reg-email">Email</label>
        <input
          type="email"
          class="input-field"
          id="reg-email"
          placeholder="example@mail.com"
          autocomplete="email"
        />
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
          <polyline points="22,6 12,13 2,6"/>
        </svg>
      </div>

      <div class="field-wrap">
        <label class="field-label" for="reg-password">Пароль</label>
        <input
          type="password"
          class="input-field"
          id="reg-password"
          placeholder="••••••••"
          autocomplete="new-password"
          oninput="checkStrength(this.value)"
        />
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <button class="password-toggle" type="button" id="toggle-reg-password" aria-label="Показать пароль">
          <svg id="reg-eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <div class="strength-bar" id="strength-bar">
          <div class="strength-bar-seg" id="seg1"></div>
          <div class="strength-bar-seg" id="seg2"></div>
          <div class="strength-bar-seg" id="seg3"></div>
          <div class="strength-bar-seg" id="seg4"></div>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>
    </div>

    <div class="auth-error" id="reg-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="reg-error-text"></span>
    </div>

    <p class="policy-hint">
      Создавая аккаунт, вы соглашаетесь с <a href="/html/policy.html">Политикой сервиса</a>.
    </p>

    <button class="btn-auth" id="reg-btn" onclick="doRegisterNew()">
      <span class="btn-text">Зарегистрироваться</span>
      <span class="btn-spinner"></span>
    </button>

    <div class="auth-divider"><span>уже есть аккаунт?</span></div>

    <div class="auth-footer">
      <a href="/html/login.html">Войти в существующий аккаунт</a>
    </div>

  </div>
</div>

<script src="../js/auth.js"></script>
<script>
  document.getElementById('toggle-reg-password').addEventListener('click', function() {
    var inp = document.getElementById('reg-password');
    var isPass = inp.type === 'password';
    inp.type = isPass ? 'text' : 'password';
    document.getElementById('reg-eye-icon').innerHTML = isPass
      ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  });

  function checkStrength(val) {
    var segs = [document.getElementById('seg1'), document.getElementById('seg2'), document.getElementById('seg3'), document.getElementById('seg4')];
    var label = document.getElementById('strength-label');
    segs.forEach(function(s) { s.className = 'strength-bar-seg'; });
    if (!val) { label.textContent = ''; return; }
    var score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    var cls = score <= 1 ? 'weak' : score <= 3 ? 'medium' : 'strong';
    var labels = ['', 'Слабый', 'Средний', 'Хороший', 'Надёжный'];
    for (var i = 0; i < score; i++) segs[i].classList.add(cls);
    label.textContent = labels[score] || '';
    label.style.color = cls === 'weak' ? '#EF4444' : cls === 'medium' ? '#F59E0B' : '#4ADE80';
  }

  function showAuthError(msg) {
    var el = document.getElementById('reg-error');
    document.getElementById('reg-error-text').textContent = msg;
    el.classList.add('visible');
  }
  function hideAuthError() {
    document.getElementById('reg-error').classList.remove('visible');
  }

  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  async function doRegisterNew() {
    hideAuthError();
    var username = document.getElementById('reg-username').value.trim();
    var email    = document.getElementById('reg-email').value.trim();
    var password = document.getElementById('reg-password').value;

    if (!username || !email || !password) { showAuthError('Заполните все поля'); return; }
    if (username.length < 3) { showAuthError('Имя пользователя — минимум 3 символа'); return; }
    if (!isValidEmail(email)) { showAuthError('Введите корректный email'); return; }
    if (password.length < 6) { showAuthError('Пароль — минимум 6 символов'); return; }

    var btn = document.getElementById('reg-btn');
    btn.classList.add('loading');

    try {
      var r = await fetch('/api/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ username, email, password })
      });
      var data = await r.json();
      if (!r.ok) { showAuthError(data.error || 'Ошибка регистрации'); return; }
      if (data.user) { try { localStorage.setItem('noryx_user', JSON.stringify(data.user)); } catch(e){} }
      window.location.href = '/html/profile.html';
    } catch(e) {
      showAuthError('Ошибка сети. Попробуйте снова');
    } finally {
      btn.classList.remove('loading');
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doRegisterNew();
  });
</script>
</body>
</html>
